---
# Basic Site Settings
locale: "en-US"
site_theme: "default"
title: "Mahlet Tadesse"
title_separator: "-"
name: &name "Mahlet Tadesse"
description: &description "Cybersecurity portfolio and personal site"
url: https://mahita-pixel.github.io/Mahlet-Tadesse.github.io
baseurl: ""  # must be empty for username.github.io repo
repository: "mahita-pixel/Mahlet-Tadesse.github.io"

# Author Info
author:
  avatar: "profile.png"
  name: "Mahlet Tadesse"
  pronouns: "she/her"
  bio: "Cybersecurity professional: Ethical Hacking, Penetration Testing, Red Team"
  location: "Addis Ababa, Ethiopia"
  employer: "Independent / Freelancer"
  email: "mahita744@gmail.com"
  github: "mahita-pixel"

# Output settings
permalink: /:title/   # ensures pages like /about/ work
include:
  - _pages
  - files
exclude:
  - node_modules
  - vendor
  - Gemfile
  - package.json

# Collections
collections:
  teaching:
    output: true
  publications:
    output: true
  portfolio:
    output: true
  talks:
    output: true

# Defaults for pages
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Plugins
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
---
